name: daily-diary
on:
  schedule:
    # GitHub runs these as whoever last committed to them, so only the repo owner should edit them:
    # commits by Claude <noreply@anthropic.com> belong to an outside account, and no run ever fired
    # off the hour: GitHub delays or drops scheduled events at :00 under load
    - cron: "17 2 * * *"    # 10:17pm EDT (9:17pm EST: finds yesterday's entry and skips)
    - cron: "17 3 * * *"    # 10:17pm EST (11:17pm EDT: finds today's entry and skips)
    - cron: "37 13 * * *"   # next-morning catch-up: generates only if both night runs were dropped
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (default: today in New York)"
        required: false
permissions:
  contents: write
concurrency: daily-diary    # never two runs writing at once

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub cron is UTC-only: every schedule fires, and this guard lets exactly one generate.
      # The date is the latest New York day whose 10pm has passed, so a run before 10pm catches up yesterday
      - id: when
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ "$(TZ=America/New_York date +%-H)" -ge 22 ]; then d=$(TZ=America/New_York date +%F)
          else d=$(TZ=America/New_York date -d yesterday +%F); fi
          d="${INPUT_DATE:-$d}"
          echo "date=$d" >> "$GITHUB_OUTPUT"
          if [ -f "website/data/$d.json" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.when.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.when.outputs.skip != '1'
        working-directory: backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          pip install .
          python -m diary.generate --date "${{ steps.when.outputs.date }}"
      - if: steps.when.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add website/data
          git commit -m "diary: ${{ steps.when.outputs.date }}"
          git push
