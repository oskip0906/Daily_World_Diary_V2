name: prune
# Deletes entries older than 30 days (New York time) after each daily run. It follows the daily run
# instead of having its own cron because a schedule only fires while the repo owner last committed it
on:
  workflow_run:
    workflows: [daily-diary]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-diary    # the daily run's lock: never two runs writing at once

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cutoff=$(TZ=America/New_York date -d '30 days ago' +%F)
          for f in website/data/????-??-??.json; do
            if [[ "$(basename "$f" .json)" < "$cutoff" ]]; then git rm -q "$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet || { git commit -m "prune: entries before $cutoff" && git push; }
