name: redesign
# Re-runs only the design step on existing entries, oldest first; their text is kept
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "YYYY-MM-DD dates, space-separated (default: every entry)"
        required: false
permissions:
  contents: write
concurrency: daily-diary    # the daily run's lock: never two runs writing at once

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          DATES: ${{ inputs.dates }}
        run: |
          pip install .
          python -m diary.generate --redesign $DATES
      - if: success() || failure()    # a day that failed keeps its old design; commit the rest
        env:
          DATES: ${{ inputs.dates }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add website/data
          git diff --staged --quiet || { git commit -m "redesign: ${DATES:-every entry}" && git push; }
