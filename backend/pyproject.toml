[project]
name = "diary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "openai",
    "markdown",
    "nh3",
    "yfinance>=1.7.0",
    "tinycss2>=1.5.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["diary"]
